name: macOS prerelease

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-alpha.*', 'v*-beta.*']
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize a candidate using the release credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  REQUIRE_MACOS_NOTARIZATION: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.notarize) }}

jobs:
  build:
    name: Validate and package Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Import Developer ID and notarization credentials
        if: env.REQUIRE_MACOS_NOTARIZATION == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/import-macos-signing.sh
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - name: Install FLAC for the real-server tests
        run: command -v flac || brew install flac
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Package prerelease
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./scripts/package-macos.sh
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "trash-amp"))')
          printf 'archive=target/dist/trash-amp-%s-macos-arm64.zip\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify the extracted package
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: ./scripts/verify-macos-package.sh "$ARCHIVE"
      - name: Save notarization diagnostics
        if: always() && env.REQUIRE_MACOS_NOTARIZATION == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-notarization
          path: target/notarization
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-arm64-prerelease
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary signing keychain
        if: always() && env.REQUIRE_MACOS_NOTARIZATION == 'true'
        run: ./scripts/cleanup-macos-signing.sh

  release:
    name: Publish prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-arm64-prerelease
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish the verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-prerelease.sh "$RELEASE_TAG" dist
