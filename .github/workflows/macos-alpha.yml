name: macOS alpha

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-alpha.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-alpha-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    name: Validate and package Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - name: Install FLAC for the real-server tests
        run: command -v flac || brew install flac
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Package alpha
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./scripts/package-macos.sh
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "trash-amp"))')
          printf 'archive=target/dist/trash-amp-%s-macos-arm64.zip\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify the extracted package
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: ./scripts/verify-macos-package.sh "$ARCHIVE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-arm64-alpha
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-arm64-alpha
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --prerelease --notes-file "$notes"
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --verify-tag --draft --prerelease --title "Trash Amp $RELEASE_TAG" --notes-file "$notes"
          fi
