name: TrashAmp
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.aberrantwolf.TrashAmp.iOS
    EXECUTABLE_NAME: trash-amp-ios
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ARCHS: arm64
    SYMROOT: $(SRCROOT)/../../target/ios-xcode/Products
    OBJROOT: $(SRCROOT)/../../target/ios-xcode/Intermediates
targets:
  TrashAmp:
    type: application
    platform: iOS
    sources: []
    postCompileScripts:
      - name: Build Rust application
        script: '"$SRCROOT/../../scripts/bundle-ios.sh" --xcode'
        basedOnDependencyAnalysis: false
