[package]
name = "trash-amp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Album-focused music player"
repository = "https://github.com/AberrantWolf/trash-amp"

[dependencies]
amp-audio.workspace = true
amp-collector.workspace = true
amp-ui.workspace = true
amp-app.workspace = true
amp-media.workspace = true
anyhow.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
souvlaki.workspace = true
rfd = "0.17"
directories = "6"
webbrowser = "1"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
amp-apple-library.workspace = true

# Linux package, built by scripts/package-linux.sh (cargo-deb). Window-system
# libraries are loaded at runtime, so they are listed here; cargo-deb's $auto
# finds the directly linked ones (ALSA, D-Bus, fontconfig, FreeType).
[package.metadata.deb]
name = "trash-amp"
maintainer = "Scott Harper <AberrantWolf@users.noreply.github.com>"
copyright = "2026 Trash Amp contributors"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
extended-description = """\
Trash Amp is a music player built around albums. It plays local folders, \
including network shares, CUE/BIN and redumper disc images, and music from \
Collector servers, and fills in missing album details from MusicBrainz. \
Collector logins are stored with Secret Service, such as KWallet or GNOME Keyring."""
depends = "$auto, libxkbcommon0, libegl1 | libgl1, libwayland-client0 | libx11-6"
recommends = "libwayland-egl1, libx11-xcb1, libxcursor1, libxi6, libxkbcommon-x11-0, libxrender1, libgl1"
suggests = "libvulkan1"
assets = [
    ["target/release/trash-amp", "usr/bin/", "755"],
    ["../../packaging/linux/org.aberrantwolf.TrashAmp.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/org.aberrantwolf.TrashAmp.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/64.png", "usr/share/icons/hicolor/64x64/apps/org.aberrantwolf.TrashAmp.png", "644"],
    ["../../packaging/linux/icons/128.png", "usr/share/icons/hicolor/128x128/apps/org.aberrantwolf.TrashAmp.png", "644"],
    ["../../packaging/linux/icons/256.png", "usr/share/icons/hicolor/256x256/apps/org.aberrantwolf.TrashAmp.png", "644"],
    ["../../packaging/linux/icons/512.png", "usr/share/icons/hicolor/512x512/apps/org.aberrantwolf.TrashAmp.png", "644"],
    # Generated by scripts/generate-notices.py before packaging.
    ["target/release/notices/**/*", "usr/share/doc/trash-amp/", "644"],
]
