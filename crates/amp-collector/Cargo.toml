[package]
name = "amp-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
amp-core.workspace = true
amp-audio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
collector-client = { path = "../../../junk-collector/crates/collector-client" }
rusqlite = { version = "0.33", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
[dev-dependencies]
tempfile = "3"
collector-server = { path = "../../../junk-collector/crates/collector-server" }
collector-store = { path = "../../../junk-collector/crates/collector-store" }
collector-app = { path = "../../../junk-collector/crates/collector-app" }
collector-providers = { path = "../../../junk-collector/crates/collector-providers" }
rcgen = "0.13"
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }

rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
junk-libs-audio = { workspace = true, features = ["decode-compressed"] }
