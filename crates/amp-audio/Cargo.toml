[package]
name = "amp-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
bs2b.workspace = true
amp-core.workspace = true
anyhow.workspace = true
junk-libs-disc.workspace = true
junk-libs-audio = { workspace = true, features = ["decode-compressed"] }
junk-libs-playback.workspace = true
cpal = "0.18.2"
rtrb = "0.3"
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSDictionary", "NSString", "NSValue", "NSObject", "block2"] }
[dev-dependencies]
hound = "3"
tempfile = "3"
