[workspace]
resolver = "2"
members = ["crates/amp-apple-library", "crates/amp-core", "crates/amp-library", "crates/amp-audio", "crates/amp-desktop", "crates/amp-collector", "crates/amp-ui", "crates/amp-ios", "crates/amp-app", "crates/amp-media"]
default-members = ["crates/amp-desktop"]
exclude = ["vendor/winit"]

[patch.crates-io]
# Backport the iOS resume fix from winit#4703 until it ships for Slint's 0.30 API.
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.1.0-beta.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
amp-apple-library = { path = "crates/amp-apple-library" }
bs2b = "0.2"
amp-app = { path = "crates/amp-app" }
amp-media = { path = "crates/amp-media" }
amp-ui = { path = "crates/amp-ui" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "raw-window-handle-06"] }
souvlaki = "0.8"
amp-collector = { path = "crates/amp-collector" }
amp-core = { path = "crates/amp-core" }
amp-library = { path = "crates/amp-library" }
amp-audio = { path = "crates/amp-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
junk-libs-disc = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-audio = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98", features = ["decode-wav", "disc-readers", "resample"] }
junk-libs-playback = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }

[profile.dev.package."*"]
opt-level = 2
