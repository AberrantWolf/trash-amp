[workspace]
resolver = "2"
members = ["crates/amp-core", "crates/amp-library", "crates/amp-audio", "crates/amp-desktop", "crates/amp-collector"]
default-members = ["crates/amp-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
amp-collector = { path = "crates/amp-collector" }
amp-core = { path = "crates/amp-core" }
amp-library = { path = "crates/amp-library" }
amp-audio = { path = "crates/amp-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
junk-libs-disc = { git = "https://github.com/AberrantWolf/junk-libs", rev = "993afc932c6b2acb5cf02c95d3cb8a387d9a70a5" }
junk-libs-audio = { git = "https://github.com/AberrantWolf/junk-libs", rev = "993afc932c6b2acb5cf02c95d3cb8a387d9a70a5", features = ["decode-wav", "disc-readers", "resample"] }
junk-libs-playback = { git = "https://github.com/AberrantWolf/junk-libs", rev = "993afc932c6b2acb5cf02c95d3cb8a387d9a70a5" }

[profile.dev.package."*"]
opt-level = 2
